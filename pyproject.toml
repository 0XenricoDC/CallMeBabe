[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "centralino-ai"
version = "0.1.0"
description = "Assistente vocale telefonico multi-tenant per piccole attivita italiane"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core voice pipeline — owner-locked versions (CLAUDE.md)
    # Install name: pipecat-ai  Import: pipecat  (NOT pipecat-flows!)
    "pipecat-ai[deepgram,anthropic,elevenlabs,silero,webrtc,whisper,runner]==1.4.0",
    # Structured conversation flows — install: pipecat-ai-flows  import: pipecat_flows
    # DO NOT use the pip name pipecat-flows (wrong package — CLAUDE.md "What NOT to Use")
    "pipecat-ai-flows==1.3.0",
    # Prebuilt browser WebRTC UI served at /prebuilt/ (Phase 1 local dev)
    "pipecat-ai-small-webrtc-prebuilt==2.5.0",
    # Persistence
    "aiosqlite>=0.20",
    # Config / secrets
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
